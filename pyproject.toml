[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avo-harness"
version = "0.3.0"
description = "Unofficial long-horizon agent orchestration inspired by NVIDIA AVO"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "AVO Harness contributors"}]
dependencies = []

[project.optional-dependencies]
nemo = ["nemo-fabric>=0.2,<0.3"]
deepagents = ["nemo-fabric[deepagents]>=0.2,<0.3"]
codex = ["nemo-fabric[codex]>=0.2,<0.3"]
claude = ["nemo-fabric[claude]>=0.2,<0.3"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
dev = ["pytest>=8", "fastapi>=0.115,<1", "httpx>=0.28,<1"]

[project.scripts]
avo-harness = "avo_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
