[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avo-harness"
version = "0.4.0"
description = "Unofficial long-horizon agent orchestration inspired by NVIDIA AVO"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "AVO Harness contributors"}]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
# NeMo Fabric's adapter packages are version-coupled to the runtime. Keep every
# adapter extra on the exact runtime release exercised by clean-install CI rather
# than letting a future 0.2.x publication silently change production behavior.
# Hermes Agent 0.20+ itself is source-installed by scripts/install_hermes.py.
nemo = ["nemo-fabric[hermes-agent]==0.2.0"]
deepagents = ["nemo-fabric[deepagents]==0.2.0"]
codex = ["nemo-fabric[codex]==0.2.0"]
claude = ["nemo-fabric[claude]==0.2.0"]
mini-swe-agent = ["nemo-fabric[mini-swe-agent]==0.2.0"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "webauthn>=3,<4"]
dev = ["pytest>=8", "fastapi>=0.115,<1", "httpx>=0.28,<1", "webauthn>=3,<4"]

[project.scripts]
avo-harness = "avo_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
