name: AVO Harness

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create isolated environment
        run: python -m venv "$RUNNER_TEMP/avo-install"
      - name: Install pinned Hermes Agent source
        run: "$RUNNER_TEMP/avo-install/bin/python" scripts/install_hermes.py "$RUNNER_TEMP/hermes-agent"
      - name: Install Avo as a package
        run: |
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/avo-install/bin/python" -m pip install '.[web,nemo]'
          "$RUNNER_TEMP/avo-install/bin/python" -m pip check
      - name: Verify installed CLI and default adapter preflight
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/avo-install/bin/avo-harness" --help >/dev/null
          "$RUNNER_TEMP/avo-install/bin/avo-harness" init --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/avo.json"
          "$RUNNER_TEMP/avo-install/bin/avo-harness" doctor -c "$RUNNER_TEMP/avo.json"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: ui/package.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Export web
        run: npx expo export --platform web

  image:
    runs-on: ubuntu-latest
    needs: [test, install-smoke, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build unified web/API image
        run: docker build --tag avo-code-ci .
      - name: Verify packaged runtime
        run: |
          docker run --rm --entrypoint python avo-code-ci -m pip check
          docker run --rm --entrypoint avo-harness avo-code-ci --help >/dev/null
